<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnquoCoop · Sistema de gestión</title>
    <script>
      // Aplica el tema guardado antes del primer pintado (clave definida en src/shared/theme)
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('enquocoop-theme') || 'null');
          var theme = stored && stored.state && stored.state.theme;
          if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
