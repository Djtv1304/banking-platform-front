version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop # los PRs entran por develop, nunca directo a master
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # no adoptar versiones recién publicadas (mitiga paquetes comprometidos)
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
