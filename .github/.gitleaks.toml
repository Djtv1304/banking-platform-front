# Configuración de Gitleaks: reglas por defecto + excepciones mínimas.
title = "Gitleaks - banking-platform-front"

[extend]
useDefault = true

# Los hashes "integrity" del lockfile disparan falsos positivos de claves genéricas.
[[allowlists]]
description = "Lockfile de npm (hashes de integridad)"
paths = ['''package-lock\.json$''']
