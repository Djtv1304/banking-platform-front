# CI único del proyecto: calidad (lint · tipos · build) + seguridad (dependencias · secretos · SAST).
# Corre en cada PR hacia develop/master y en cada push a develop/master.
# El despliegue y las previews NO se hacen aquí: los gestiona Cloudflare Workers Builds.
# SonarQube Cloud tampoco: está conectado desde su web (análisis automático) y aporta su propio check.
# Todas las acciones están fijadas por SHA (cadena de suministro); Dependabot las mantiene al día.
name: CI · Calidad y seguridad

on:
  pull_request:
    branches: [master, develop] # sin paths-ignore: un check obligatorio que no corre deja el PR bloqueado
  push:
    branches: [master, develop]
  workflow_dispatch:

# Mínimo privilegio: el GITHUB_TOKEN solo puede leer el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  # ---------------------------------------------------------------------------
  # Calidad: sintaxis, tipos y build de producción
  # ---------------------------------------------------------------------------
  calidad:
    name: Calidad (lint · tipos · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Antes de instalar: los paquetes deben venir de registry.npmjs.org (https) con hash sha512
      - name: Verificar integridad del lockfile
        run: node .github/scripts/verify-lockfile.mjs

      # npm ci respeta exactamente el lockfile; --ignore-scripts bloquea scripts postinstall maliciosos
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: ESLint (cero warnings)
        run: npm run lint -- --max-warnings=0

      - name: TypeScript (chequeo de tipos)
        run: npm run typecheck

      - name: Pruebas unitarias (Vitest)
        run: npm test

      - name: Build de producción
        run: npm run build

      # Se reutiliza en el job de secretos para escanear el bundle exacto que se publicaría
      - name: Subir build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Dependencias: vulnerabilidades conocidas y firmas del registro
  # ---------------------------------------------------------------------------
  dependencias:
    name: Dependencias (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar integridad del lockfile
        run: node .github/scripts/verify-lockfile.mjs

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      # Lo que llega al navegador del cliente: falla desde severidad moderada
      - name: npm audit (producción)
        run: npm audit --omit=dev --audit-level=moderate

      # Herramientas de desarrollo: solo bloquea vulnerabilidades altas o críticas
      - name: npm audit (todo el árbol)
        run: npm audit --audit-level=high

      # Verifica firmas y procedencia de los paquetes descargados del registro npm
      - name: npm audit signatures
        run: npm audit signatures

  # ---------------------------------------------------------------------------
  # Secretos filtrados: historial git completo + bundle compilado
  # ---------------------------------------------------------------------------
  secretos:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    needs: calidad
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Bloquea .env, llaves privadas y archivos de credenciales versionados (solo se permite .env.example)
      - name: Archivos sensibles versionados
        run: |
          found=$(git ls-files | grep -iE \
            '(^|/)\.env($|\.)|\.(pem|key|p12|pfx|jks|keystore|crt)$|(^|/)\.dev\.vars|(^|/)(id_rsa|id_ed25519|id_ecdsa|credentials\.json|secrets?\.(json|ya?ml))$' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::Archivos sensibles en el repositorio:"
            echo "$found"
            exit 1
          fi

      - name: Instalar Gitleaks (con verificación de checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 -o "$tarball" "$base/$tarball"
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks · historial git
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

      - name: Descargar build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Las variables VITE_* se incrustan en el JS público: aquí nunca debe aparecer un secreto
      - name: Gitleaks · bundle (dist/)
        run: gitleaks dir --config .gitleaks.toml --redact --verbose --exit-code 1 dist

  # ---------------------------------------------------------------------------
  # SAST: análisis estático de seguridad del código (OWASP, React, XSS…)
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.184.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep
        run: >-
          semgrep scan
          --config p/react
          --config p/typescript
          --config p/javascript
          --config p/owasp-top-ten
          --config p/secrets
          --error
          --metrics=off
          --exclude node_modules
          --exclude dist
