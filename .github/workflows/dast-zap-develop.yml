# DAST: OWASP ZAP baseline (rastreo + análisis pasivo, NO ataca) contra la Preview estable de develop.
# Requisitos (una sola vez):
#   Variable del repo   DAST_TARGET_URL   = https://develop-banking-platform-front.<tu-subdominio>.workers.dev
#   Secretos del repo   CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET (Service Token de Cloudflare Access)
# Nunca apuntar a producción ni usar escaneo activo: el Worker reenvía /api/* al backend real.
name: DAST · ZAP baseline (develop)

on:
  schedule:
    - cron: '0 7 * * 1' # lunes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast
  cancel-in-progress: false

jobs:
  zap:
    name: ZAP baseline
    if: vars.DAST_TARGET_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Escaneo ZAP baseline
        env:
          TARGET: ${{ vars.DAST_TARGET_URL }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          # Cabeceras del Service Token para atravesar Cloudflare Access (solo si hay secretos)
          zargs=()
          if [ -n "$CF_ID" ] && [ -n "$CF_SECRET" ]; then
            zopts="-config replacer.full_list(0).description=cf-id -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=CF-Access-Client-Id -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=${CF_ID} -config replacer.full_list(1).description=cf-secret -config replacer.full_list(1).enabled=true -config replacer.full_list(1).matchtype=REQ_HEADER -config replacer.full_list(1).matchstr=CF-Access-Client-Secret -config replacer.full_list(1).regex=false -config replacer.full_list(1).replacement=${CF_SECRET}"
            zargs=(-z "$zopts")
          fi
          # -I: los avisos no rompen el job (endurecer luego con un archivo de reglas -c)
          docker run --rm -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t "$TARGET" -r zap-report.html -J zap-report.json -I "${zargs[@]}"

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: zap-out
          retention-days: 14
          if-no-files-found: ignore
